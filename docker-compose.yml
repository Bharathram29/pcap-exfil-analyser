services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pcap-exfil-backend
    ports:
      - "8000:8000"
    environment:
      PCAP_ANALYSER_ENVIRONMENT: production
      PCAP_ANALYSER_LOG_LEVEL: INFO
      PCAP_ANALYSER_JSON_LOGS: "true"
      PCAP_ANALYSER_MAX_UPLOAD_SIZE_BYTES: "104857600"
      PCAP_ANALYSER_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - backend_data:/app/data
      - ./reports:/app/reports
      - ./backend/rules:/app/rules:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pcap-exfil-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
